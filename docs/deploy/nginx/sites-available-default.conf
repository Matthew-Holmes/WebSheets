# A snapshot of /etc/nginx/sites-available/default on the droplet, kept here so
# the box can be rebuilt from something other than memory.
#
# The deploy script does NOT apply this file. Certbot edits the real one in
# place - the "managed by Certbot" lines below are its work - so overwriting it
# from here would undo the certificate wiring. Read it, diff it, paste the part
# you need.
#
# Note that containerising the two services changed nothing here: the site is
# still an ordinary process listening on 127.0.0.1:5000, and the generator is
# still reachable only from the host itself.

map $http_connection $connection_upgrade {
    "~*Upgrade" $http_connection;
    default keep-alive;
}

upstream helloapp {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    listen [::]:80;
    server_name matthewsmathematics.uk www.matthewsmathematics.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matthewsmathematics.uk www.matthewsmathematics.uk;

    ssl_certificate /etc/ssl/certs/mmCert.crt;
    ssl_certificate_key /etc/ssl/private/mmKey.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass http://helloapp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

upstream garage_web {
    server 127.0.0.1:3902;
}

server {
    server_name files.matthewsmathematics.uk;

    location / {
        proxy_pass http://garage_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/files.matthewsmathematics.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/files.matthewsmathematics.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = files.matthewsmathematics.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name files.matthewsmathematics.uk;
    return 404; # managed by Certbot
}
